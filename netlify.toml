# netlify.toml
[build]
  command = "pnpm run build"

[build.environment]
  NODE_VERSION = "26"
  PNPM_VERSION = "11.22.0"

# Security Headers (Adapter does not add these automatically)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"